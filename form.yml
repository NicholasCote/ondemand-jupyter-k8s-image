---
cluster: "cirrus"

form:
  - custom_image
  - cpu
  - memory
  - gpus

attributes:
  custom_image:
    widget: text_field
    label: "Container image"
    value: "quay.io/jupyter/scipy-notebook:2026-11-16"
    help: |
      Any image with `jupyter` in it, reachable from the Cirrus cluster, such as
      the [Jupyter Docker Stacks](https://quay.io/organization/jupyter) images:
      `quay.io/jupyter/datascience-notebook`, `quay.io/jupyter/pytorch-notebook`,
      `quay.io/jupyter/tensorflow-notebook`. Add a tag for the version you want.

      Sessions end after **1 hour with no activity** in notebooks or terminals,
      and after **12 hours** in any case. Save your work in your home directory.
    required: true
  cpu:
    widget: number_field
    label: "CPUs"
    min: 1
    max: 8
    value: 1
    step: 1
    required: true
  memory:
    widget: number_field
    label: "Memory (GB)"
    min: 1
    max: 32
    value: 4
    step: 1
    required: true
  gpus:
    widget: check_box
    # A check_box renders its label inline next to the box rather than above
    # the field, so it does not match the other inputs. `header` is rendered as
    # markdown above any widget, which puts the field name where the eye
    # expects it. Needs OnDemand >= 4.1.0; older versions ignore it, in which
    # case make this a select with Yes/No options instead.
    header: "**GPUs**"
    label: "Request an NVIDIA GPU"
    unchecked_value: 0
    checked_value: 1
    # NOT required. On a checkbox, `required` means "must be checked" -- the
    # browser refuses to submit the form while the box is empty, which would
    # make every CPU-only session impossible to launch.
    required: false
    help: |
      Check the box to request one NVIDIA GPU (`nvidia.com/gpu`); leave it clear
      for a CPU-only session. The image has to be able to use one — requesting a
      GPU does not add CUDA or a GPU-enabled framework build to an image that
      lacks them.
