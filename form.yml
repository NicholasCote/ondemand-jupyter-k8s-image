---
cluster: "cirrus"

form:
  - custom_image
  - cpu
  - memory
  - gpus
  - wall_time

attributes:
  custom_image:
    widget: text_field
    label: "Container image"
    value: "hub.k8s.ucar.edu/cirrus-jhub/jhub-cpu-nb:0.1.5"
    help: |
      Any Jupyter Docker Stacks-compatible image (must contain `/usr/local/bin/start.sh`
      and `jupyter`), reachable from the Cirrus cluster. Examples:
      `quay.io/jupyter/scipy-notebook:latest`, `quay.io/jupyter/datascience-notebook:latest`,
      `quay.io/jupyter/tensorflow-notebook:latest`.
    required: true
  cpu:
    widget: number_field
    label: "CPUs"
    min: 1
    max: 8
    value: 1
    step: 1
    required: true
  memory:
    widget: number_field
    label: "Memory (GB)"
    min: 1
    max: 32
    value: 4
    step: 1
    required: true
  gpus:
    widget: check_box
    label: "GPUs"
    unchecked_value: 0
    checked_value: 1
    required: true
    help: |
      NVIDIA GPUs to request (`nvidia.com/gpu`). Check the box to start with 1 Nvidia GPU. 
      The image has to be able to use one — requesting a GPU does not
      add CUDA or a GPU-enabled framework build to an image that lacks them.
  wall_time:
    widget: number_field
    label: "Wall time (hours)"
    min: 1
    max: 24
    value: 1
    step: 1
    required: true